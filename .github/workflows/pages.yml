name: GitHub Pages (Fiszki PWA)

on:
  push:
    branches: [main]
    paths: ['web/**', 'dane/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publikuj sprawdzoną aplikację na GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fiszki-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Choniawko/aplikacja-fiszki---python-web'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PWA_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build:offline && npm run build:pwa
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.offline.config.ts
      - run: npx playwright test --config playwright.pwa.config.ts
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist-pwa

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publikuj PWA
        id: deployment
        uses: actions/deploy-pages@v4
